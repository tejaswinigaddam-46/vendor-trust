services:
  postgres:
    image: postgres:17
    container_name: vendortrust-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: vendor_admin
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: vendortrust

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendor_admin -d vendortrust"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
